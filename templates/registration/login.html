{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Creative - Bootstrap 3 Responsive Admin Template">
  <meta name="author" content="GeeksLabs">
  <meta name="keyword" content="Creative, Dashboard, Admin, Template, Theme, Bootstrap, Responsive, Retina, Minimal">
  <link rel="shortcut icon" href="{% static "img/favicon.png" %}">

  <title>Connexion | Digital Den</title>

  <!-- Bootstrap CSS -->
  <link href="{% static "css/bootstrap.min.css" %}" rel="stylesheet">
  <!-- bootstrap theme -->
  <link href="{% static "css/bootstrap-theme.css" %}" rel="stylesheet">
  <!--external css-->
  <!-- font icon -->
  <link href="{% static "css/elegant-icons-style.css" %}" rel="stylesheet" />
  <link href="{% static "css/font-awesome.css" %}" rel="stylesheet" />
  <!-- Custom styles -->
  <link href="{% static "css/style.css" %}" rel="stylesheet" />
  <link href="{% static "css/style-responsive.css" %}" rel="stylesheet" />
  <link href="{% static "css/animate.css" %}" rel="stylesheet">
  <!-- HTML5 shim and Respond.js IE8 support of HTML5 -->
  <!--[if lt IE 9]>
    <script src="{% static "js/html5shiv.js" %}"></script>
    <script src="{% static "js/respond.min.js" %}"></script>
    <![endif]-->
</head>

<body class="login-img3-body">

  <div class="container animated fadeInUp">

    <form class="login-form" name="LoginForm" action="{% url 'login' %}" method="post">
      {% csrf_token %}
      <div class="login-wrap">
        <p class="login-img"><img src="{% static "img/logo.png" %}" style="width:300px;" alt="Logo"><br></p>
        <div class="input-group">
          <span class="input-group-addon"><i class="icon_profile"></i></span>
          <input type="text" class="form-control" id="username" name="username" required="required" placeholder="Nom d'utilisateur" autofocus>
        </div>
        <div class="input-group">
          <span class="input-group-addon"><i class="icon_key_alt"></i></span>
          <input type="password" name="password" id="password" class="form-control" required="required" placeholder="Mot de passe">
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Connexion</button>
        {% if form.errors %}
        <br><div class="alert alert-block alert-danger fade in">
            <button data-dismiss="alert" class="close close-sm" type="button">
                <i class="icon-remove"></i>
            </button>

            <strong>Erreur !</strong> Votre mot de passe ou nom d'utilisateur n'est pas bon. C'est le même que sur le Active Directory.

        </div>
        {% endif %}
      </div>
    </form>
   </div>


</body>

</html>
